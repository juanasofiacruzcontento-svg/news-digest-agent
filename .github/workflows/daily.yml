name: Notiziario quotidiano

on:
  schedule:
    - cron: "0 6 * * *"   # ogni giorno alle 6:00 UTC = 7:00 in Italia (8:00 con l'ora legale)
  workflow_dispatch:       # permette di avviarlo a mano dal tab "Actions"

permissions:
  contents: write          # serve per salvare il notiziario nel repository

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prepara e invia il notiziario
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python main.py -v
      - name: Salva il notiziario nel repository
        run: |
          git config user.name "news-digest-bot"
          git config user.email "news-digest-bot@users.noreply.github.com"
          git add digests/
          git diff --cached --quiet || git commit -m "🗞️ Notiziario del $(date +%Y-%m-%d)"
          git push
